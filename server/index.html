<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICHARD v3.1</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap");

        /* RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-color: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.3);
            --admin-color: #fbbf24;
        }

        body {
            background: url("img/b.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* --- LOGIN OVERLAY --- */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .login-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-bottom: 25px;
            letter-spacing: 0.3rem;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        /* --- LAYOUT --- */
        #header {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.2rem;
            flex-shrink: 0;
            z-index: 10;
        }

        #logout-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.4);
            padding: 8px 15px;
            font-size: 0.7rem;
            color: #f87171;
            cursor: pointer;
            border-radius: 8px;
        }

        #chat {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        #input-area {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        /* --- ELEMENTS --- */
        .msg {
            align-self: flex-start;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            border-bottom-left-radius: 2px;
            max-width: 80%;
            word-wrap: break-word;
            animation: msgIn 0.3s ease-out;
        }

        .msg-admin {
            border-color: var(--admin-color);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.15);
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        #user-input {
            flex-grow: 1;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            background: var(--primary-color);
            border: none;
            border-radius: 12px;
            color: white;
            padding: 12px 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            box-shadow: 0 0 20px var(--primary-glow);
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        #error-msg {
            color: #f87171;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>RICHARD</h2>
            <input type="text" id="username" placeholder="BENUTZERNAME">
            <input type="password" id="password" placeholder="PASSWORT">

            <button onclick="checkLogin()">LOGIN</button>
            <button onclick="register()"
                style="margin-top: 10px; background: transparent; border: 1px solid #38bdf8; color: #38bdf8; box-shadow: none;">
                REGISTRIEREN
            </button>

            <div id="error-msg">Anmeldung fehlgeschlagen!</div>
        </div>
    </div>

    <div id="header">
        RICHARD v3.1
        <button id="logout-btn" onclick="logout()">LOGOUT</button>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Nachricht an Server senden...">
        <button id="send-btn" onclick="sendMsg()">SENDEN</button>
    </div>

    <script>
        let currentIdx = 0;
        let savedUser = "";
        let savedPass = "";
        let chatInterval = null;
        const chatDiv = document.getElementById('chat');

        async function checkLogin() {
            savedUser = document.getElementById('username').value;
            savedPass = document.getElementById('password').value;

            const success = await updateChat();
            if (success) {
                document.getElementById('login-overlay').style.opacity = "0";
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = "none";
                }, 500);

                chatInterval = setInterval(updateChat, 500);
            } else {
                const errorEl = document.getElementById('error-msg');
                errorEl.style.display = "block";
            }
        }

        async function register() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (!u || !p) return alert("Bitte Felder ausfüllen!");

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                if (response.ok) alert("Erfolgreich registriert!");
                else alert("Fehler: Name eventuell vergeben.");
            } catch (e) { alert("Server nicht erreichbar"); }
        }

        async function sendMsg() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            try {
                const response = await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: `${savedUser}: ${text}` })
                });
                if (response.ok) {
                    inputField.value = "";
                    updateChat();
                }
            } catch (e) { console.error("Senden fehlgeschlagen"); }
        }

        async function updateChat() {
            try {
                const response = await fetch(`/get?last_id=${currentIdx}`, {
                    headers: { "X-User": savedUser, "X-Pass": savedPass }
                });

                if (response.status === 401) return false;

                const data = await response.json();

                // --- FIX: WENN SERVER GELEERT WURDE ---
                // Wenn die Gesamtanzahl auf dem Server plötzlich kleiner ist als unser lokaler Index,
                // wurde die Datenbank geleert.
                if (data.total < currentIdx) {
                    chatDiv.innerHTML = "";
                    currentIdx = 0;
                }

                data.messages.forEach(m => {
                    const el = document.createElement('div');
                    el.className = 'msg';

                    // Admin-Styling hervorheben
                    if (m.text.toLowerCase().startsWith("admin:") || m.text.toLowerCase().startsWith("[server]:")) {
                        el.classList.add('msg-admin');
                    }

                    el.textContent = `> ${m.text}`;
                    chatDiv.appendChild(el);
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                });

                currentIdx = data.total;
                return true;
            } catch (e) { return false; }
        }

        function logout() {
            clearInterval(chatInterval);
            location.reload();
        }

        // Tasten-Events
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkLogin();
        });
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>

</html>
